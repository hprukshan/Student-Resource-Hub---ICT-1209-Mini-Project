<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Notes - Xnotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            
            background-image: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
        }

        
        .glass-element {
            background: rgba(255, 255, 255, 0.6) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7) !important;
        }

        .glass-card {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border-radius: 1rem;
        }

        .icon-btn {
            font-size: 1.9rem;
            color: #967bb6;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        
        .btn-theme {
            background-color: #967bb6;
            color: white;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s ease;
        }
        .btn-theme:hover {
            background-color: #7e679a;
            color: white;
        }

        /* Drag and Drop Zone */
        .upload-dropzone {
            border: 2px dashed #967bb6;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.4);
            transition: background 0.3s ease;
        }
        .upload-dropzone:hover {
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

<body>

    
    <nav class="navbar navbar-expand-lg glass-element shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="index.html" title="Home">
                            <i class="bi bi-house-door-fill icon-btn"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#" title="About">
                            <i class="bi bi-info-circle-fill icon-btn"></i>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn px-4 fw-semibold"
                            style="border: 2px solid #967bb6; color: #967bb6; border-radius: 50px;"
                            href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn px-4 text-white fw-semibold shadow-sm"
                            style="background-color: #967bb6; border-radius: 50px;" href="register.html">Signup</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container mt-5 mb-5 main-content d-flex justify-content-center align-items-center">
        <div class="col-md-8 col-lg-6">
            <div class="card glass-element glass-card p-4 p-md-5">
                
                <h3 class="fw-bold text-center mb-4" style="color: #333;">Upload Xnotes</h3>

                <form>
                    
                    <div class="mb-3">
                        <select class="form-select form-select-lg rounded-pill shadow-sm border-0 fw-semibold text-white" style="background-color: #967bb6; font-size: 1rem;" required>
                            <option selected disabled value="">Module Code ▼</option>
                            <option value="ICT 1209">ICT 1209 - Web Technologies</option>
                            <option value="ICT 1207">ICT 1207 - Human Computer Interaction</option>
                            <option value="ICT 2304">ICT 2304 - Object Oriented Programming</option>
                            <option value="ICT 2308">ICT 2308 - Database Systems</option>
                            <option value="ICT 3201">ICT 3201 - Software Project Management</option>
                            <option value="ICT 4306">ICT 4306 - Data Science</option>
                        </select>
                    </div>

                
                    <div class="mb-4">
                        <input type="text" class="form-control form-control-lg rounded-pill shadow-sm border-0 text-center fw-semibold text-white" style="background-color: #967bb6; font-size: 1rem;" placeholder="Note Title" required>
                    </div>

                    <!-- Upload Area -->
                    <div class="upload-dropzone p-4 text-center mb-4 cursor-pointer">
                        <i class="bi bi-cloud-arrow-up display-6 text-secondary mb-2"></i>
                        <p class="mb-1 fw-semibold text-dark">Drag & Drop PDF here</p>
                        <p class="text-muted small mb-2">or</p>
                        <label for="fileInput" class="btn btn-sm btn-outline-dark rounded-pill px-3 fw-semibold">
                            [ Browse ]
                        </label>
                        <input type="file" id="fileInput" class="d-none" accept=".pdf">
                    </div>

                    <!-- Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-theme btn-lg rounded-pill shadow-sm py-2">Upload Note</button>
                    </div>
                </form>

            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="glass-element py-4 mt-auto">
        <div class="container text-center text-dark fw-medium">
            &copy; 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

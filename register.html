<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Xnotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Button & Text Styles */
        .btn-custom {
            background-color: #967bb6;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #7a6396;
            color: white;
        }
        .text-custom {
            color: #967bb6;
        }
    </style>
</head>

<body style="background-color:lavender; display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==================== TOP NAVIGATION BAR ==================== -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm py-0">
        <div class="container">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="90">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-custom" href="register.html">Signup</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ==================== MAIN CONTENT (SIGN UP FORM) ==================== -->
    <div class="container flex-grow-1 d-flex justify-content-center align-items-center mt-5 mb-5">
        <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 500px;">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4">Create an Account</h3>
                <p class="text-center text-muted mb-4">Join Xnotes to access BICT resources</p>

                <!-- Error Message Box (Hidden by default) -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="fullName" placeholder="Enter your full name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Create a password">
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control form-control-lg" id="confirmPassword" placeholder="Confirm your password">
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-custom btn-lg fw-bold">Sign Up</button>
                    </div>
                    
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="login.html" class="text-custom text-decoration-none fw-bold">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== FOOTER ==================== -->
    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container text-secondary fw-medium text-center">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ==================== CUSTOM JAVASCRIPT (FORM VALIDATION) ==================== -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(event) {
            
            let nameValue = document.getElementById('fullName').value.trim();
            let emailValue = document.getElementById('email').value.trim();
            let passwordValue = document.getElementById('password').value.trim();
            let confirmPasswordValue = document.getElementById('confirmPassword').value.trim();
            let errorAlert = document.getElementById('errorAlert');

            // 1. Check if any fields are empty
            if (nameValue === '' || emailValue === '' || passwordValue === '' || confirmPasswordValue === '') {
                event.preventDefault(); 
                errorAlert.innerText = 'Please fill in all fields!';
                errorAlert.classList.remove('d-none');
                return;
            }

            // 2. Check if Passwords match
            if (passwordValue !== confirmPasswordValue) {
                event.preventDefault(); 
                errorAlert.innerText = 'Passwords do not match!';
                errorAlert.classList.remove('d-none');
                return;
            }

            // ඔක්කොම හරි නම් error message එක hide කරලා form එක submit වෙන්න දෙනවා
            errorAlert.classList.add('d-none');
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Xnotes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: lavender;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
        }

        .btn-custom {
            background-color: #967bb6;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #7a6396;
            color: white;
        }

        .text-custom {
            color: #967bb6;
        }
    </style>
</head>

<body>

 <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">
                    <!-- Home අයිකන් එක -->
                    <li class="nav-item">
                        <a class="nav-link active px-3" href="index.html" title="Home">
                            <i class="bi bi-house-door-fill" style="font-size: 1.9rem; color: #967bb6;"></i>
                        </a>
                    </li>
                    <!-- About අයිකන් එක -->
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#" title="About">
                            <i class="bi bi-info-circle-fill" style="font-size: 1.9rem; color: #967bb6;"></i>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn px-4 fw-semibold" style="border: 2px solid #967bb6; color: #967bb6; border-radius: 50px;" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn px-4 text-white fw-semibold shadow-sm" style="background-color: #967bb6; border-radius: 50px;" href="register.html">Signup</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT (SIGN UP FORM) -->
    <div class="container d-flex justify-content-center align-items-center mt-5 mb-5 main-content">
        <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 500px;">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-2">Create an Account</h3>
                <p class="text-center text-muted mb-4">Join Xnotes to access BICT resources</p>

                <!-- Error Message Box -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

                <form id="registerForm">
                    <div class="mb-3">
                        <label for="fullName" class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control form-control-lg" id="fullName"
                            placeholder="Enter your full name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">University Email</label>
                        <input type="email" class="form-control form-control-lg" id="email"
                            placeholder="username@tec.rjt.ac.lk">
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password"
                            placeholder="Create a password">
                    </div>
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control form-control-lg" id="confirmPassword"
                            placeholder="Confirm your password">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-custom btn-lg fw-bold">Sign Up</button>
                    </div>

                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="login.html"
                                class="text-custom text-decoration-none fw-bold">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container text-center text-secondary fw-medium">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT VALIDATION -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (event) {

            let name = document.getElementById('fullName').value.trim();
            let email = document.getElementById('email').value.trim();
            let password = document.getElementById('password').value.trim();
            let confirmPassword = document.getElementById('confirmPassword').value.trim();
            let errorAlert = document.getElementById('errorAlert');

            // Check whether all the required fields are completed or not
            if (name === '' || email === '' || password === '' || confirmPassword === '') {
                event.preventDefault();
                errorAlert.innerText = 'Please fill in all fields!';
                errorAlert.classList.remove('d-none');
                return;
            }

            // Check the entered email ends with the required domain
            if (!email.endsWith('@tec.rjt.ac.lk')) {
                event.preventDefault();
                errorAlert.innerText = 'Please use a valid Rajarata University email (@tec.rjt.ac.lk)!';
                errorAlert.classList.remove('d-none');
                return;
            }

            // Check whether if the passsword matches 
            if (password !== confirmPassword) {
                event.preventDefault();
                errorAlert.innerText = 'Passwords do not match!';
                errorAlert.classList.remove('d-none');
                return;
            }

            //If all the requirement are ok, then the error message will be hidden
            errorAlert.classList.add('d-none');
        });
    </script>
</body>

</html>

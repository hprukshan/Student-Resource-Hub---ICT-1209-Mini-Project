<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Xnotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: lavender;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
        }

        .btn-custom {
            background-color: #967bb6;
            color: white;
            border: none;
        }

        .btn-custom:hover {
            background-color: #7a6396;
            color: white;
        }

        .text-custom {
            color: #967bb6;
        }
    </style>
</head>

<body>

    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm py-0">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="90">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-custom" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Signup</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- LOGIN FORM -->
    <div class="container d-flex justify-content-center align-items-center mt-5 mb-5 main-content">
        <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-2">Welcome Back!</h3>
                <p class="text-center text-muted mb-4">Login to access your BICT resources</p>

                <!-- Error Message Box -->
                <div id="errorAlert" class="alert alert-danger d-none" role="alert">Please enter both Email and
                    Password!</div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email"
                            placeholder="Enter your university email">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password"
                            placeholder="Enter your password">
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-custom btn-lg fw-bold">Login</button>
                    </div>

                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="register.html"
                                class="text-custom text-decoration-none fw-bold">Sign up</a></p>
                    </div>
                    <div class="text-center">
                        <p class="mb-0">Forget passsword? <a href="mailto:thenethdulshan@gmail.com"
                                class="text-custom text-decoration-none fw-bold">Contact us</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container text-center text-secondary fw-medium">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SIMPLE JAVASCRIPT VALIDATION -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            let email = document.getElementById('email').value.trim();
            let password = document.getElementById('password').value.trim();
            let errorAlert = document.getElementById('errorAlert');

            if (email === '' || password === '') {
                event.preventDefault();
                errorAlert.classList.remove('d-none');
            } else {
                errorAlert.classList.add('d-none');
            }
        });
    </script>

</body>

</html>

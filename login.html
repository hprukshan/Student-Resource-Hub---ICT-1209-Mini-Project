<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Xnotes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom Button Style */
        .btn-custom {
            background-color: #967bb6;
            color: white;
            border: none;
        }
        .btn-custom:hover {
            background-color: #7a6396; /* Slightly darker shade for hover */
            color: white;
        }
        .text-custom {
            color: #967bb6;
        }
    </style>
</head>

<body style="background-color:lavender; display: flex; flex-direction: column; min-height: 100vh;">

    <!-- ==================== TOP NAVIGATION BAR ==================== -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link active fw-bold text-custom" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Signup</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- (LOGIN FORM) -->
    <div class="container flex-grow-1 d-flex justify-content-center align-items-center mt-5 mb-5">
        <div class="card shadow-lg border-0 rounded-4" style="width: 100%; max-width: 450px;">
            <div class="card-body p-5">
                <h3 class="text-center fw-bold mb-4">Welcome Back!</h3>
                <p class="text-center text-muted mb-4">Login to access your BICT resources</p>

               
                <div id="errorAlert" class="alert alert-danger d-none" role="alert">
                    Please enter both Email and Password!
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email address</label>
                        <input type="email" class="form-control form-control-lg" id="email" placeholder="Enter your email">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password">
                    </div>
                    
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-custom btn-lg fw-bold">Login</button>
                    </div>
                    
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="register.html" class="text-custom text-decoration-none fw-bold">Sign up</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container text-secondary fw-medium text-center">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!--  (FORM VALIDATION)  -->
    <script>
        // මේ function එක 
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            
            let emailValue = document.getElementById('email').value.trim();
            let passwordValue = document.getElementById('password').value.trim();
            let errorAlert = document.getElementById('errorAlert');

            if (emailValue === '' || passwordValue === '') {
                
                // Form එක submit වෙන එක නවත්වනවා
                event.preventDefault(); 
                
                
                errorAlert.classList.remove('d-none');
                
            } else {
        
                errorAlert.classList.add('d-none');
                
       
            }
        });
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Xnotes</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #967bb6;
            --primary-hover: #7e679a;
        }

        body {
            background-image: linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)), url('background.jpg');
            background-size: cover; 
            background-position: center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
        }

        .text-theme { color: var(--primary-color) !important; }
        
        .btn-outline-theme {
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            border-radius: 50px;
            font-weight: 600;
        }
        .btn-outline-theme:hover {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-theme {
            background-color: var(--primary-color);
            color: white;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.3s ease;
        }
        .btn-theme:hover {
            background-color: var(--primary-hover);
            color: white;
        }

        .glass-card {
            border-radius: 1rem;
            backdrop-filter: blur(5px);
            background-color: rgba(255, 255, 255, 0.95);
        }
    </style>
</head>

<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="index.html" title="Home">
                            <i class="bi bi-house-door-fill text-theme" style="font-size: 1.9rem;"></i>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#" title="About">
                            <i class="bi bi-info-circle-fill text-theme" style="font-size: 1.9rem;"></i>
                        </a>
                    </li>
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn px-4 btn-outline-theme" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link btn px-4 btn-theme shadow-sm" href="register.html">Signup</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT (LOGIN FORM) -->
    <div class="container d-flex justify-content-center align-items-center mt-5 mb-5 main-content">
        <div class="card shadow-lg border-0 glass-card" style="width: 100%; max-width: 450px;">
            <div class="card-body p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <i class="bi bi-box-arrow-in-right text-theme" style="font-size: 3rem;"></i>
                    <h3 class="fw-bold mt-2">Welcome Back</h3>
                    <p class="text-muted">Login to access your Xnotes</p>
                </div>

                <div id="loginError" class="alert alert-danger d-none text-center" role="alert"></div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control form-control-lg" id="email" placeholder="username@tec.rjt.ac.lk">
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter your password">
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                        </div>
                        <a href="#" class="text-theme text-decoration-none fw-semibold">Forgot Password?</a>
                    </div>

                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-theme btn-lg">Login</button>
                    </div>

                    <div class="text-center">
                        <p class="mb-0">Don't have an account? <a href="register.html" class="text-theme text-decoration-none fw-bold">Sign up</a></p>
                    </div>
                </form>
                
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="bg-light py-4 mt-auto border-top">
        <div class="container text-center text-secondary fw-medium">
            &copy; 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Basic Login Validation -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (event) {
            let email = document.getElementById('email').value.trim();
            let password = document.getElementById('password').value.trim();
            let errorAlert = document.getElementById('loginError');

            if (email === '' || password === '') {
                event.preventDefault();
                errorAlert.innerText = 'Please enter both email and password!';
                errorAlert.classList.remove('d-none');
            } else {
                errorAlert.classList.add('d-none');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xnotes - The BICT Resource Hub</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            /* Background Image with a white transparent overlay */
            background-image: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.1)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .main-content {
            flex-grow: 1;
        }

        /* Glass Element Design Class */
        .glass-element {
            background: rgba(255, 255, 255, 0.5) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
        }

        .glass-card {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Hover animation for cards */
        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(150, 123, 182, 0.4);
            cursor: pointer;
        }

        .icon-btn {
            font-size: 1.9rem;
            color: #967bb6;
            transition: transform 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.5) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6) !important;
            border-radius: 25px;
            height: 44px;
            padding: 0 1.25rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .glass-btn:hover {
            background: rgba(255, 255, 255, 0.8) !important;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <!-- NAVBAR SECTION -->
    <nav class="navbar navbar-expand-lg glass-element shadow-sm py-2">
        <div class="container-fluid px-4">
            <a class="navbar-brand p-0 m-0" href="index.html">
                <img src="logonew1.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav align-items-center gap-2">

                    <!-- Home Icon -->
                    <li class="nav-item">
                        <a class="nav-link active px-3" href="index.html" title="Home">
                            <i class="bi bi-house-door-fill icon-btn"></i>
                        </a>
                    </li>

                    <!-- About Icon -->
                    <li class="nav-item">
                        <a class="nav-link px-3" href="#" title="About">
                            <i class="bi bi-info-circle-fill icon-btn"></i>
                        </a>
                    </li>

                    <!-- Login Button -->
                    <li class="nav-item ms-lg-3">
                        <a class="nav-link btn px-4 fw-semibold"
                            style="border: 2px solid #967bb6; color: #967bb6; border-radius: 50px;"
                            href="login.html">Login</a>
                    </li>

                    <!-- Signup Button -->
                    <li class="nav-item">
                        <a class="nav-link btn px-4 text-white fw-semibold shadow-sm"
                            style="background-color: #967bb6; border-radius: 50px;" href="register.html">Signup</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="container mt-5 main-content">

        <!-- Welcome Text -->
        <div class="text-center mb-4">
            <h1 class="fw-bold">Welcome to <span style="color:red;">X</span><span style="color:black">notes</span></h1>
            <p class="fs-5 mt-2 text-dark">The ultimate BICT Resource Hub for undergraduates</p>
        </div>

        <!-- SEARCH BAR -->
        <div class="row justify-content-center mb-5">
            <div class="col-md-10 col-lg-8">
                <div class="input-group input-group-lg glass-element rounded-pill overflow-hidden shadow-sm">
                    <span class="input-group-text bg-transparent border-0 px-4">
                        <i class="bi bi-search" style="color: #967bb6;"></i>
                    </span>
                    <input type="text" id="searchInput" class="form-control border-0 shadow-none bg-transparent"
                        placeholder="Search for lecture notes, past papers...">
                </div>
                <p class="text-muted mt-2 text-center" style="font-size: 0.85rem;">
                    <b>These can only be accessed with a valid tec.rjt.ac.lk domain email. You need to use your student
                        mail to view resources.</b>
                </p>
            </div>
        </div>

        <!-- CATEGORIES, ADD NOTE & YEAR FILTER -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <h4 class="mb-0 fw-bold" id="categoryTitle">Popular Categories:</h4>

            <div class="d-flex align-items-center gap-3">

                <!-- Add Note Button -->
                <a href="upload.html"
                    class="glass-btn shadow-sm text-dark fw-semibold text-decoration-none d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-paperclip" style="font-size: 1.25rem;"></i> Add Note
                </a>

                <!-- Year Filter -->
                <div class="position-relative d-flex align-items-center">
                    <select id="yearFilter" class="glass-btn shadow-sm text-dark fw-semibold m-0"
                        style="appearance: none; -webkit-appearance: none; outline: none; padding-right: 2.5rem; width: 120px;">
                        <option selected value="All">Year</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                    <!-- Custom Dropdown Icon -->
                    <i class="bi bi-chevron-down position-absolute fw-bold"
                        style="right: 15px; pointer-events: none; font-size: 0.9rem; color: #212529;"></i>
                </div>

            </div>
        </div>

        <!-- Card Container -->
        <div class="row mb-5" id="cardContainer"></div>

    </div>

    <!-- FOOTER -->
    <footer class="glass-element py-4 mt-auto">
        <div class="container text-center text-dark fw-medium">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Array containing all module data [Year, Subject Code, Name, IsPopular]
        const modules = [
            [1, "ICT 1202", "Electronic Circuits", 0], [1, "ICT 1305", "Program Designing and Programming", 0], [1, "ICT 1111", "Productivity and Collaborative Tools", 0], [1, "CMT 1301", "Fundamentals of Physics for Technology", 0], [1, "CMT 1303", "Fundamentals of Mathematics for Technology", 0], [1, "CML 1301", "Personality Development", 0], [1, "CMT 1005", "Communication Skills I", 0], [1, "ICT 1210", "Introduction to Multimedia", 0], [1, "ICT 1108", "Skill Development Project I", 0], [1, "ICT 1209", "Web Technologies", 1], [1, "ICT 1207", "Human Computer Interaction", 1], [1, "CML 1203", "Principles of Management", 0], [1, "CML 1204", "Health and Wellbeing", 0], [1, "CMT 1009", "Communication Skills II", 0], [1, "CMT 1307", "Mathematics For Technology I", 0], [1, "ENT 1302", "Fundamentals of Electricity and Magnetism", 0],
            [2, "ICT 2202", "Operating Systems", 0], [2, "ICT 2303", "Data Structures and Algorithms", 0], [2, "ICT 2304", "Object Oriented Programming", 0], [2, "ICT 2207", "Software System Design", 0], [2, "ICT 2212", "Skill Development Project II", 0], [2, "CML 2202", "Engineering Economics", 0], [2, "CMT 2002", "Communication Skills III", 0], [2, "EET 2207", "Mathematics for Technology II", 0], [2, "ICT 2305", "Computational Mathematics", 0], [2, "ICT 2214", "Introduction to Information Systems", 0], [2, "ICT 2211", "Fundamentals of Statistics", 0], [2, "ICT 2213", "Data Communication and Networking", 0], [2, "ICT 2308", "Database Systems", 0], [2, "ICT 2109", "Communication and Learning Skills", 0], [2, "CML 2204", "Foreign Language", 0], [2, "CML 2205", "Ethics for Science and Technology", 0],
            [3, "ICT 3201", "Software Project Management", 1], [3, "ICT 3203", "Scientific Computer Applications", 0], [3, "CML 3101", "Legal and Patent Aspects", 0], [3, "ICT 3312", "Software Verification and Validation", 0], [3, "ICT 3206", "Skills Development Project III", 0], [3, "ICT 3314", "Advanced Computer Networks", 0], [3, "ICT 3208", "Design and Analysis of Algorithms", 0], [3, "ICT 3307", "Computational Statistics", 0], [3, "ICT 3217", "Advance Computer Networks", 0], [3, "ICT 3209", "Computer Organization and Architecture", 0], [3, "ICT 3310", "Information Security", 0], [3, "ICT 3311", "Robotics", 0], [3, "ICT 3315", "Internet of Things", 0], [3, "ICT 3213", "Advanced SW System Design", 0], [3, "ICT 3216", "Research Methodology", 0], [3, "ICT 3204", "E-Business Systems", 0], [3, "CML 3203", "Basics of Accountancy", 0],
            [4, "ICT 4301", "Mobile Computing", 0], [4, "ICT 4202", "Internet Applications", 0], [4, "ICT 4203", "Software Engineering", 0], [4, "ICT 4205", "Current Topics in Information Technology", 0], [4, "ICT 4306", "Data Science", 1], [4, "ICT 4207", "Artificial Intelligence", 0], [4, "ICT 4210", "Digital Image Processing", 0], [4, "ICT 4211", "Computer Graphics and Visualization", 0], [4, "CML 4201", "Entrepreneurship", 0], [4, "CML 4202", "Human Resource Management", 0]
        ];

        // Getting HTML Elements
        let searchInput = document.getElementById('searchInput');
        let yearFilter = document.getElementById('yearFilter');
        let cardContainer = document.getElementById('cardContainer');
        let categoryTitle = document.getElementById('categoryTitle');

        // Main function to display modules
        function renderCards() {
            let selectedYear = yearFilter.value;
            let searchText = searchInput.value.toLowerCase().trim();

            // Check if page is in default state (No search and Year is All)
            let isDefaultState = (selectedYear === "All" && searchText === "");

            // Change the title based on user actions
            if (isDefaultState) {
                categoryTitle.innerText = "Popular Categories:";
            } else {
                categoryTitle.innerText = "Search Results:";
            }

            let html = "";
            let matchCount = 0;

            // Loop through the modules array
            modules.forEach(function (mod) {
                let y = mod[0], code = mod[1], name = mod[2], isPopular = mod[3];

                // Check whether year and search text match with module data
                let matchYear = (selectedYear === "All" || selectedYear == y);
                let matchSearch = code.toLowerCase().includes(searchText) || name.toLowerCase().includes(searchText);

                let shouldShow = false;

                // Show only popular modules in default state
                if (isDefaultState) {
                    if (isPopular === 1) shouldShow = true;
                } else {
                    // Show modules that match search and filter
                    if (matchYear && matchSearch) shouldShow = true;
                }

                // If module matches, generate HTML card
                if (shouldShow) {
                    matchCount++;
                    html += `
                    <div class="col-md-4 mb-3 module-card">
                        <div class="card glass-element glass-card rounded h-100 p-2">
                            <div class="card-body">
                                <h5 class="card-title fw-bold">${code}</h5>
                                <p class="card-text fw-semibold">${name}</p>
                                <a href="#" class="btn btn-sm text-white" style="background-color: #967bb6;">View Notes ▼</a>
                            </div>
                        </div>
                    </div>`;
                }
            });

            // If no modules found, display this message
            if (matchCount === 0) {
                html = `<div class="col-12 text-center text-muted mt-4"><p>No modules found for your search.</p></div>`;
            }

            // Output generated HTML to the container
            cardContainer.innerHTML = html;
        }

        renderCards();
        searchInput.addEventListener('input', renderCards);
        yearFilter.addEventListener('change', renderCards);
    </script>
</body>

</html>

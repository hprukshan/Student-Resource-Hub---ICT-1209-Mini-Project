<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xnotes - The BICT Resource Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-color:lavender">

    <!-- TOP NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.png" alt="Xnotes Logo" height="80">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Signup</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <!--MAIN-->
    <div class="container mt-5">

        <div class="text-center mb-4">
            <h2 class="fw-bold">Welcome to Xnotes - The BICT Resource Hub</h2>
        </div>

        <div class="row justify-content-center mb-5">
            <div class="col-md-8">
                <input type="text" class="form-control form-control-lg bg-secondary bg-opacity-25"
                    placeholder="Search for notes...">
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0 fw-bold">Popular Categories:</h4>

            <select id="yearFilter" class="form-select w-auto bg-light border-secondary">
                <option selected value="All">Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
            </select>
        </div>

        <!-- CTEGORY CARDS-->
        <div class="row mb-5" id="cardContainer">


            <div class="col-md-4 mb-3 module-card" data-year="1">
                <div class="card shadow-sm rounded h-100 p-2">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">ICT 1209</h5>
                        <p class="card-text fw-semibold">Web Technologies</p>
                        <a href="#" class="btn btn-sm text-white" style="background-color: #967bb6;">View Notes ▼</a>
                    </div>
                </div>
            </div>


            <div class="col-md-4 mb-3 module-card" data-year="1">
                <div class="card shadow-sm rounded h-100 p-2">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">ICT-1207</h5>
                        <p class="card-text fw-semibold">Human Computer Interaction</p>
                        <a href="#" class="btn btn-sm text-white" style="background-color: #967bb6;">View Notes ▼</a>
                    </div>
                </div>
            </div>


            <div class="col-md-4 mb-3 module-card" data-year="4">
                <div class="card shadow-sm rounded h-100 p-2">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">ICT-4306</h5>
                        <p class="card-text fw-semibold">Artificial Intelligence</p>
                        <a href="#" class="btn btn-sm text-white" style="background-color: #967bb6;">View Notes ▼</a>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <footer class="bg-light py-4 mt-5 border-top">
        <div class="container text-secondary fw-medium">
            (c) 2026 Xnotes | Rajarata University BICT
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        document.getElementById('yearFilter').addEventListener('change', function () {


            let selectedYear = this.value;

            let cards = document.querySelectorAll('.module-card');

            // card eka check karanawa
            cards.forEach(function (card) {
                let cardYear = card.getAttribute('data-year');


                if (selectedYear === "All" || selectedYear === cardYear) {
                    card.style.display = 'block'; // Card eka pennanawa
                } else {
                    card.style.display = 'none';
                }
            });
        });
    </script>

</body>

</html>
